# Rebuilds the README pictures, the chord file and docs/tape.json whenever
# tape.toml, the song, the chords or the tools change. You can also run it by hand
# from the Actions tab ("build tape" -> "Run workflow").
name: build tape

on:
  push:
    paths:
      - tape.toml
      - "docs/**.mp3"
      - "docs/**.m4a"
      - "docs/**.ogg"
      - "docs/**.wav"
      - docs/chords.json
      - "tools/**"
      - .github/workflows/tape.yml
  workflow_dispatch:

permissions:
  contents: write

# One build per branch at a time; a newer push cancels the older, still-running build.
concurrency:
  group: tape-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Only the default branch (whatever it is called), or a manual run.
    # The bot check is a second safety net: pushes made with GITHUB_TOKEN never
    # start new workflow runs, so the "build tape" commit cannot loop anyway.
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
       github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python packages
        run: pip install numpy scipy

      - name: Build
        run: python tools/build.py

      - name: Commit and push changes
        run: |
          if [ -z "$(git status --porcelain -- assets docs README.md)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          for p in assets docs README.md; do
            if [ -e "$p" ] || git ls-files --error-unmatch -- "$p" >/dev/null 2>&1; then
              git add -A -- "$p"
            fi
          done
          git commit -m "build tape"
          # If someone pushed while we were building, replay our commit on top and retry once.
          git push || { git pull --rebase origin "$GITHUB_REF_NAME" && git push; }
