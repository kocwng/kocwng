# Edit this to change your widgets; see https://github.com/kocwng/pernik
schema = 1
theme = "komik"
output = "pernik"
# user = "kocwng"   # found automatically in the GitHub Action

[[widget]]
id = "hello"
kind = "hero"
chords = "docs/tape/chords.json"
tagline = "don't touch prod on friday."
hp = [7, 7]
exp = 1
exp_label = "love"

[[widget]]
id = "line"
kind = "divider"
style = "truntum"

[[widget]]
id = "tape"
kind = "mixtape"
song = "docs/music.m4a"
label = "kocwng tape~"
chords = "off"
video = "auto"
make_video = true

[[widget]]
id = "stack-title"
kind = "heading"
note = "things i use"

[[widget]]
id = "stack"
kind = "stack"
icons = ["go", "docker", "swagger", "mysql", "aws", "googlecloud", "cloudflare"]

[[widget]]
id = "bye"
kind = "footer"
text = "thanks for stopping by! reach me at 💌idakusumaconnect@gmail.com"
