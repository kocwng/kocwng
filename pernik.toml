# Edit this to change your widgets; see https://github.com/kocwng/pernik
schema = 1
theme = "komik"
output = "pernik"
# user = "kocwng"   # found automatically in the GitHub Action

[[widget]]
id = "hello"
kind = "hero"
chords = "docs/tape/chords.json"
tagline = "don't touch prod on friday."
hp = [7, 7]
exp = 1
exp_label = "love"

[[widget]]
id = "line"
kind = "divider"
style = "truntum"

[[widget]]
id = "tape"
kind = "mixtape"
song = "docs/music.m4a"
label = "kocwng tape~"
chords = "keep"   # use the hand-fixed chords in docs/tape/chords.json
video = "auto"
make_video = true

# tech stack as a garden: one tree per group, the tools are the fruit
[[widget]]
id = "kebun"
kind = "garden"
harvest = true
mascot = "banana"

[[widget.tree]]
name = "languages & frameworks"
tree = "mangga"
icons = ["go", "python", "rust", "nodejs", "typescript", "echo", "gin", "fiber", "fastapi", "flask", "nextdotjs", "react"]
logos = { echo = "assets/logos/echo.svg", fiber = "assets/logos/fiber.svg" }

[[widget.tree]]
name = "data"
tree = "kelapa"
icons = ["mysql", "postgresql", "mongodb", "redis", "kafka", "vertica", "dbeaver"]
logos = { vertica = "assets/logos/vertica.svg" }

[[widget.tree]]
name = "infra & tools"
tree = "rambutan"
icons = ["docker", "kubernetes", "linux", "aws", "googlecloud", "cloudflare", "grafana", "uptimerobot", "git", "postman", "swagger", "termius"]
logos = { aws = "assets/logos/aws.svg", uptimerobot = "assets/logos/uptimerobot.svg" }

[[widget.tree]]
name = "ai & editors"
tree = "pisang"
icons = ["claude", "codex", "grok", "deepseek", "aws bedrock", "ibm watson", "vscode", "antigravity", "kiro"]
logos = { codex = "assets/logos/codex.svg", grok = "assets/logos/grok.svg", "aws bedrock" = "assets/logos/aws-bedrock.svg", "ibm watson" = "assets/logos/ibm-watson.svg", vscode = "assets/logos/vscode.svg", antigravity = "assets/logos/antigravity.svg", kiro = "assets/logos/kiro.svg" }

[[widget]]
id = "bye"
kind = "footer"
text = "thanks for stopping by! reach me at 💌idakusumaconnect@gmail.com"
