# Edit this to change your widgets; see https://github.com/kocwng/pernik
schema = 1
theme = "komik"
output = "pernik"
# user = "kocwng"   # found automatically in the GitHub Action

[[widget]]
id = "hello"
kind = "hero"
chords = "docs/tape/chords.json"
tagline = "don't touch prod on friday."
hp = [7, 7]
exp = 1
exp_label = "love"

[[widget]]
id = "line"
kind = "divider"
style = "truntum"

[[widget]]
id = "tape"
kind = "mixtape"
song = "docs/music.m4a"
label = "kocwng tape~"
chords = "keep"   # use the hand-fixed chords in docs/tape/chords.json
video = "auto"
make_video = true

[[widget]]
id = "stack-title"
kind = "heading"
text = "languages & frameworks"
note = "things i use"

[[widget]]
id = "stack"
kind = "stack"
icons = ["go", "python", "rust", "nodejs", "typescript", "echo", "gin", "fiber", "gorm", "fastapi", "flask", "nextdotjs", "react"]

[[widget]]
id = "data-title"
kind = "heading"
text = "data"

[[widget]]
id = "data"
kind = "stack"
icons = ["mysql", "postgresql", "mongodb", "redis", "kafka", "vertica", "dbeaver"]

[[widget]]
id = "infra-title"
kind = "heading"
text = "infra & tools"

[[widget]]
id = "infra"
kind = "stack"
icons = ["docker", "kubernetes", "linux", "aws", "googlecloud", "cloudflare", "grafana", "uptimerobot", "git", "postman", "swagger", "termius"]

[[widget]]
id = "ai-title"
kind = "heading"
text = "ai & editors"

[[widget]]
id = "ai"
kind = "stack"
icons = ["claude", "codex", "grok", "deepseek", "aws bedrock", "ibm watson", "vscode", "antigravity", "kiro"]

[[widget]]
id = "bye"
kind = "footer"
text = "thanks for stopping by! reach me at 💌idakusumaconnect@gmail.com"
