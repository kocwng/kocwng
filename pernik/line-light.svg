<svg xmlns="http://www.w3.org/2000/svg" width="900" height="80" viewBox="0 0 900 80" role="img" aria-labelledby="t d"><title id="t">kawung batik divider</title><desc id="d">A decorative kawung batik section divider, printed in two colours.</desc><defs><pattern id="ht1" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="3" cy="3" r="1.1" fill="#E0569B"/></pattern><pattern id="ht2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="3" cy="3" r="1.9" fill="#E0569B"/></pattern><pattern id="ht3" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="3" cy="3" r="2.6" fill="#E0569B"/></pattern><pattern id="hti" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="2.5" cy="2.5" r="1" fill="#1C1520"/></pattern><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#1C1520" stroke-width="1.5"/></pattern><style>.kd{font-family:'Arial Rounded MT Bold', 'Nunito', 'Varela Round', sans-serif;font-weight:800}.kl{font-family:'Arial Black', 'Helvetica Neue', Arial, sans-serif;font-weight:900;text-transform:uppercase;letter-spacing:.04em}.km{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-weight:600}.st{transform-box:fill-box;transform-origin:center;animation:st .45s cubic-bezier(.3,1.3,.5,1) both}@keyframes st{0%{opacity:0;transform:scale(1.25)}55%{opacity:1;transform:scale(.96)}100%{transform:scale(1)}}.dr{stroke-dasharray:1 1;animation:dr 1.1s cubic-bezier(.45,0,.3,1) both}@keyframes dr{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}.d2{animation-delay:0.2s}.d3{animation-delay:0.3s}.d4{animation-delay:0.4s}.d5{animation-delay:0.5s}.d6{animation-delay:0.6s}.d7{animation-delay:0.7s}.d8{animation-delay:0.8s}.d9{animation-delay:0.9s}.d10{animation-delay:1s}.d11{animation-delay:1.1s}@media (prefers-reduced-motion: red