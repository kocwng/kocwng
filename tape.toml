# Settings for the pictures in README.md and for the music page in docs/.
# Edit this file, commit, and the "build tape" GitHub Action redraws everything.
# Steps for making your own copy are in MAKE-YOUR-OWN.md.

[hero]
# One or two short lines of big colourful letters at the top.
greeting = ["hello", "there!"]

[tape]
# The song. Put the file inside docs/ (mp3, m4a, ogg or wav).
song = "docs/music.m4a"
# Words on the cassette label. Keep it short, about 16 characters.
label = "kocwng tape"
side = "A"
# The two lines next to the play button.
caption = ["give it", "a listen!"]
# Where the cassette goes when someone clicks it.
# Leave it empty to use the music page in docs/ (GitHub Pages),
# or paste a link to the song somewhere else (SoundCloud, YouTube, ...).
link = ""

[chords]
# The banana plays ukulele along with the song, and the music page shows the chords.
#   "auto" = work out the chords from the song whenever the song changes
#   "keep" = never touch docs/chords.json (use this after fixing chords by hand)
#   "off"  = no chord card, the banana just strums
mode = "auto"

[footer]
text = "thanks for stopping by!"
